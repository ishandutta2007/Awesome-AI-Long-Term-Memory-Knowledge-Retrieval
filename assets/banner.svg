<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#080b14" />
    </linearGradient>

    <linearGradient id="card-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="subtext-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="0" r="1.5" fill="#6366f1" fill-opacity="0.4" />
    </pattern>

    <style>
      .pulse-orb {
        animation: pulse 8s ease-in-out infinite alternate;
      }
      .pulse-orb-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .node-pulse {
        animation: nodeFlash 4s ease-in-out infinite alternate;
      }
      .stream-line {
        stroke-dasharray: 8 16;
        animation: streamFlow 25s linear infinite;
      }
      .stream-line-rev {
        stroke-dasharray: 6 12;
        animation: streamFlowRev 20s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1) translate(0, 0); opacity: 0.45; }
        50% { transform: scale(1.15) translate(30px, -20px); opacity: 0.7; }
        100% { transform: scale(0.95) translate(-20px, 15px); opacity: 0.4; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
        50% { transform: scale(1.2) translate(-35px, 25px); opacity: 0.65; }
        100% { transform: scale(0.9) translate(25px, -15px); opacity: 0.35; }
      }
      @keyframes streamFlow {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes streamFlowRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 400; }
      }
      @keyframes nodeFlash {
        0% { fill-opacity: 0.3; r: 3; }
        50% { fill-opacity: 0.9; r: 5; }
        100% { fill-opacity: 0.4; r: 3.5; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="pulse-orb" filter="url(#glow-cyan)">
    <circle cx="200" cy="110" r="140" fill="#06b6d4" />
  </g>
  <g class="pulse-orb-2" filter="url(#glow-purple)">
    <circle cx="1020" cy="300" r="160" fill="#8b5cf6" />
  </g>
  <g class="pulse-orb" filter="url(#glow-purple)">
    <circle cx="600" cy="50" r="90" fill="#ec4899" opacity="0.3" />
  </g>

  <!-- Dynamic Background Knowledge Flow Streams (Graph & Memory Network) -->
  <g stroke-opacity="0.35" fill="none">
    <path class="stream-line" d="M -50,180 Q 250,50 550,170 T 1250,130" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line-rev" d="M -50,280 Q 350,380 750,240 T 1250,290" stroke="#a855f7" stroke-width="2" />
    <path class="stream-line" d="M 100,-20 Q 400,220 850,100 T 1250,360" stroke="#ec4899" stroke-width="1.5" />
  </g>

  <!-- Knowledge Graph Background Nodes -->
  <g>
    <line x1="140" y1="90" x2="220" y2="150" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1" />
    <line x1="220" y1="150" x2="310" y2="110" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1" />
    <line x1="950" y1="100" x2="1060" y2="160" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1" />
    <line x1="1060" y1="160" x2="1120" y2="240" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1" />
    <line x1="1000" y1="280" x2="1120" y2="240" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1" />
    
    <circle class="node-pulse" cx="140" cy="90" r="4" fill="#38bdf8" />
    <circle class="node-pulse" cx="220" cy="150" r="5" fill="#818cf8" />
    <circle class="node-pulse" cx="310" cy="110" r="3.5" fill="#c084fc" />
    <circle class="node-pulse" cx="950" cy="100" r="4.5" fill="#ec4899" />
    <circle class="node-pulse" cx="1060" cy="160" r="5.5" fill="#a855f7" />
    <circle class="node-pulse" cx="1120" cy="240" r="4" fill="#38bdf8" />
    <circle class="node-pulse" cx="1000" cy="280" r="4.5" fill="#06b6d4" />
  </g>

  <!-- Main Card Container (Keeps Foreground Clear & Elevated) -->
  <rect x="70" y="45" width="1060" height="330" rx="20" fill="#0a0f1d" fill-opacity="0.78" stroke="url(#card-border-grad)" stroke-width="1.5" />

  <!-- Brand / Tagline Category Pill -->
  <g transform="translate(425, 75)">
    <rect width="350" height="34" rx="17" fill="url(#pill-grad)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="4" fill="#10b981" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#a5f3fc" letter-spacing="1.2">
      🧠 AWESOME AI RETRIEVAL ECOSYSTEM
    </text>
  </g>

  <!-- Hero Foreground Title -->
  <text x="600" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">
    AI Long-Term Memory &amp; Knowledge Retrieval
  </text>

  <!-- Hero Foreground Subtitle -->
  <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="url(#subtext-grad)" letter-spacing="0.2">
    Persistent Agent Memory • Spatial Palaces • Temporal Knowledge Graphs • GraphRAG • Vector Stores
  </text>

  <!-- Feature Highlights (Pill Badges) -->
  <g transform="translate(130, 275)">
    <!-- Pill 1: Stateful Agents -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="105" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e0f2fe">
        🤖 Stateful Agent Memory
      </text>
    </g>

    <!-- Pill 2: Temporal Graphs -->
    <g transform="translate(240, 0)">
      <rect width="220" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
      <text x="110" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#f3e8ff">
        🕸️ Temporal Knowledge Graphs
      </text>
    </g>

    <!-- Pill 3: GraphRAG & Hybrid Search -->
    <g transform="translate(490, 0)">
      <rect width="220" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.5" />
      <text x="110" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffe4e6">
        ⚡ GraphRAG &amp; Hybrid Search
      </text>
    </g>

    <!-- Pill 4: Semantic Caching -->
    <g transform="translate(740, 0)">
      <rect width="200" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
      <text x="100" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#d1fae5">
        🚀 Semantic Caching &amp; MCP
      </text>
    </g>
  </g>

  <!-- Outer Stroke Border -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />
</svg>